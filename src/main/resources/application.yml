server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 16
      min-spare: 2
    max-connections: 100
    accept-count: 20
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 2000
    url: ${DATABASE_URL:jdbc:h2:mem:devradar;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
devradar:
  github-url: ${GITHUB_API_URL:https://api.github.com}
  github-token: ${GITHUB_TOKEN:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
