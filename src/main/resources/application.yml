server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:devradar;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
devradar:
  github-url: ${GITHUB_API_URL:https://api.github.com}
  github-token: ${GITHUB_TOKEN:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
